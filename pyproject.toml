[project]
name = "dtcc-qes"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dtcc-core",
    "nanobind>=3.1.0",
    "numpy>=2.5.4",
]

[tool.uv.sources]
dtcc-core = { git = "https://github.com/dtcc-platform/dtcc-core.git", rev = "develop" }

[dependency-groups]
reference = [
    "netcdf4>=1.7.5.1.post1",
]
