[build-system]
requires = ["scikit-build-core>=0.12", "nanobind>=3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "dtcc-qes"
version = "0.1.0b1"
description = "DTCC integration with the QES-Winds CPU solver"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE", "src/qes_core/LICENSE", "NOTICE"]
classifiers = ["Development Status :: 4 - Beta"]
dependencies = [
    "dtcc-core",
    "numpy>=2.5.4",
]

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = ["src/dtcc_qes"]
build-dir = "build/{wheel_tag}"
# Root anchors keep names such as LICENSE from matching ignored build trees.
# Negated cache includes let the corresponding exclusions take effect.
sdist.include = [
    "/src/**", "/tests/**", "/tools/**", "/examples/**", "/demo/**", "/docs/**", "/CMakeLists.txt",
    "/README.md", "/DYNAMIC_VERTICAL_GRID.md", "/SOLVER_CONTROL_REFACTOR.md", "/WIND_PROFILES.md", "/LICENSE", "/NOTICE",
    "/validation/aij/*.py", "/validation/tests/*.py", "/validation/*.py", "/validation/*.md", "/validation/specifications/*",
    "!**/__pycache__/**", "!**/*.pyc",
]
# The QES-Public submodule is reference-only; the build uses src/qes_core.
sdist.exclude = [".idea/**", "dtcc-qes/**", "/QES-Public/**", "/build/**", "**/__pycache__/**", "**/*.pyc"]

[tool.uv.sources]
dtcc-core = { git = "https://github.com/dtcc-platform/dtcc-core.git", branch = "dev/qes-updates" }

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=8",
    "nanobind>=3.1.0",
    "scikit-build-core>=0.12",
]
reference = [
    "netcdf4>=1.7.5.1.post1",
]
validate = [
    "ezdxf>=1.4.5",
    "matplotlib>=3.11.2",
    "xlrd>=2.0.2",
]

[tool.pytest.ini_options]
# Frozen study sources are audit inputs, not additional test suites.
testpaths = ["tests"]
